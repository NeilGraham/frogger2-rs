[package]
name = "f2-n64pack"
description = "Builds the Nintendo 64 asset pack (DFS tree + manifest + budget) from an imported rendition."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[dependencies]
f2-formats = { path = "../../crates/f2-formats" }
f2-engine = { path = "../../crates/f2-engine", default-features = false, features = ["std"] }
f2-fontgen = { path = "../../crates/f2-fontgen" }
f2-n64z = { path = "../../crates/f2-n64z", features = ["encoder"] }
f2-n64fmt = { path = "../../crates/f2-n64fmt", features = ["objbank"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Deterministic maths for the portable resampler (same result on every OS).
libm = "0.2.16"
