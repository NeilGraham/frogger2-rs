# CI never has game data: tests that need it skip themselves when
# F2_GAME_DIR / F2_DATA_DIR are unset (never set them here).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # tools/memcap.sh (the Linux cargo runner) protects a shared WSL VM; CI runners are
  # disposable VMs with their own OOM killer and job timeouts.
  MEMCAP: "off"

jobs:
  # Formatting and lints once (they are not platform-specific).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Native build + headless test suite on each desktop OS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # mesa-vulkan-drivers = lavapipe, so the offscreen wgpu tests have a (software) adapter.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev mesa-vulkan-drivers
      # .cargo/config.toml's runner (tools/memcap.sh, a sh script) cannot be executed by a
      # native Windows cargo; drop it there (MEMCAP=off makes it a plain exec elsewhere).
      - if: runner.os == 'Windows'
        shell: bash
        run: rm .cargo/config.toml
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  # Cross-target `cargo check` from Linux: catches macOS-only compile errors without a Mac
  # runner, and keeps the portable core (f2-math, f2-formats, f2-game, f2-engine's render core)
  # building as no_std + alloc for consoles (docs/PLATFORMS.md §5).
  # macOS: --no-default-features drops cpal's CoreAudio backend, whose bindgen build script
  # needs the macOS SDK headers (the macos-14 test job builds it for real); frogger/desktop keeps
  # the windowed binary (its default feature) in the check.
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, thumbv7em-none-eabihf
      - run: cargo check --workspace --all-targets --no-default-features --features frogger/desktop --target aarch64-apple-darwin
      - run: cargo check --workspace --all-targets --no-default-features --features frogger/desktop --target x86_64-apple-darwin
      - run: cargo check -p f2-math -p f2-formats -p f2-game -p f2-engine --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check -p f2-formats --no-default-features --features serde --target thumbv7em-none-eabihf

  # The no_std core on a big-endian MIPS target (the N64 port, docs/N64-PLAN.md): nightly
  # -Zbuild-std of core + alloc only. mips-unknown-linux-gnu is a stand-in with the N64's
  # endianness and pointer width; the crates are no_std, so its OS does not matter.
  nostd-mips:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: cargo +nightly check -Zbuild-std=core,alloc --target mips-unknown-linux-gnu -p f2-math -p f2-formats -p f2-game -p f2-engine --no-default-features

  # The Android host (crates/frogger-android) type-checks for arm64 with the NDK the release
  # uses (27.2.12479018; installed into the runner's SDK when the image lacks it). The full
  # APK build is in release.yml (also runnable by hand there as a dry run).
  android-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-check
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: |
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          [ -d "$ndk" ] || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
          ANDROID_NDK_HOME="$ndk" cargo ndk --platform 26 -t arm64-v8a check -p frogger-android

# Release builds (every desktop OS, Android, console runtimes) and publishing:
# .github/workflows/release.yml (tags v*, or by hand for a dry run).
