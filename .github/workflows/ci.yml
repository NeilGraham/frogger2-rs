# CI never has game data: tests that need it skip themselves when
# F2_GAME_DIR / F2_DATA_DIR are unset (never set them here).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # tools/memcap.sh (the Linux cargo runner) protects a shared WSL VM; CI runners are
  # disposable VMs with their own OOM killer and job timeouts.
  MEMCAP: "off"

jobs:
  # Formatting and lints once (they are not platform-specific).
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Native build + headless test suite on each desktop OS.
  test:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # mesa-vulkan-drivers = lavapipe, so the offscreen wgpu tests have a (software) adapter.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev mesa-vulkan-drivers
      # .cargo/config.toml's runner (tools/memcap.sh, a sh script) cannot be executed by a
      # native Windows cargo; drop it there (MEMCAP=off makes it a plain exec elsewhere).
      - if: runner.os == 'Windows'
        shell: bash
        run: rm .cargo/config.toml
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  # Cross-target `cargo check` from Linux: catches macOS-only compile errors without a Mac
  # runner, and keeps the portable core (f2-math) building as no_std for future consoles.
  # macOS: --no-default-features drops cpal's CoreAudio backend, whose bindgen build script
  # needs the macOS SDK headers (the macos-14 test job builds it for real); frogger/desktop keeps
  # the windowed binary (its default feature) in the check.
  cross-check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, thumbv7em-none-eabihf
      - run: cargo check --workspace --all-targets --no-default-features --features frogger/desktop --target aarch64-apple-darwin
      - run: cargo check --workspace --all-targets --no-default-features --features frogger/desktop --target x86_64-apple-darwin
      - run: cargo check -p f2-math --no-default-features --target thumbv7em-none-eabihf

  # Manual dispatch only: release archives via tools/package (never any game data).
  release:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux}
          - {os: windows-latest, target: windows}
          - {os: macos-14, target: macos}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos' && 'aarch64-apple-darwin, x86_64-apple-darwin' || '' }}
      # ubuntu-22.04 (glibc 2.35) so the binaries/AppImage run on older distros too.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev file
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Windows: build natively, then package the exes without the WSL cross-build.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p frogger -p f2-import -p f2-viewer
          mkdir -p target/package/win-bin
          cp target/release/frogger.exe target/release/f2-import.exe target/release/f2-viewer.exe target/package/win-bin/
          F2_SKIP_BUILD=1 tools/package/package.sh windows
      # AppImage tooling runs without FUSE on hosted runners.
      - if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: tools/package/package.sh linux
      # Universal (arm64 + x86_64) .app, ad-hoc signed; see tools/package/README-macos.md.
      - if: runner.os == 'macOS'
        env:
          F2_MACOS_UNIVERSAL: "1"
        run: tools/package/package.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: frogger2-rs-${{ matrix.target }}
          path: |
            target/package/*.tar.gz
            target/package/*.zip
            target/package/*.AppImage
