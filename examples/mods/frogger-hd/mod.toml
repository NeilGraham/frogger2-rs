description = "A new high-detail Frogger in the original cartoon style (about 18k triangles, smooth-skinned to the original skeleton, so every original animation plays): big googly eyes, lime skin, orange stripe, with physically based materials (colour, normal, occlusion/roughness, and a height map for parallax occlusion) in Enhanced / Path-Traced graphics."
