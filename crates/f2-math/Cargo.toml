[package]
name = "f2-math"
description = "Bit-exact port of the original fixed-point and vector maths (Common/fixed.c, maths.c)."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true
build = "build.rs"

[features]
default = ["std"]
# Off: `#![no_std]` (core only, no allocator) for future console targets; see docs/PLATFORMS.md.
# Only the `RANDOM_LOG` stderr debug aid needs std.
std = ["serde/std"]

[dependencies]
# Not `workspace = true`: the workspace entry enables serde's default `std` feature.
serde = { version = "1", default-features = false, features = ["derive"] }
# Pure-Rust libm: OS-independent sin/cos/atan2/acos (see src/detfloat.rs).
libm = "0.2.16"

[build-dependencies]
cc = "1"

[lints.rust]
# `target_vendor = "nintendo64"` (tools/n64/mips-nintendo64-none.json): N64 hot-code sections
# (tools/n64/Makefile). Placement only; no behaviour depends on it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("nintendo64"))'] }
