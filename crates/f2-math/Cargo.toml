[package]
name = "f2-math"
description = "Bit-exact port of the original fixed-point and vector maths (Common/fixed.c, maths.c)."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true
build = "build.rs"

[dependencies]
serde = { workspace = true }
# Pure-Rust libm: OS-independent sin/cos/atan2/acos (see src/detfloat.rs).
libm = "0.2.16"

[build-dependencies]
cc = "1"
