[package]
name = "f2-fontgen"
description = "Builds the modern (high-resolution) game fonts from the typeface the pixel fonts were drawn from (Gill Sans Ultra Bold, read from the user's own system fonts)."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[[bin]]
name = "f2-fontgen"
path = "src/main.rs"

[dependencies]
ab_glyph = "=0.2.32"
f2-engine = { path = "../f2-engine", default-features = false, features = ["std"] }
