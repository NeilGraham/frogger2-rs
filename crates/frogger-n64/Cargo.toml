[package]
name = "frogger-n64"
description = "Nintendo 64 front end of the Frogger 2 port: Rust no_std + alloc core linked into a libdragon ROM (tools/n64/build.sh)."
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Own workspace (excluded from the main one): built with nightly `-Zbuild-std` for the
# custom MIPS target in tools/n64/ (see tools/n64/README.md). On the host, `cargo test`
# runs the portable self-test and probe kernels.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
f2-math = { path = "../f2-math", default-features = false }
f2-formats = { path = "../f2-formats", default-features = false, features = ["serde"] }
f2-game = { path = "../f2-game", default-features = false }
f2-engine = { path = "../f2-engine", default-features = false }
f2-draw = { path = "../f2-draw", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
libm = "0.2.16"
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

[features]
# The phase-1B bring-up demo and performance probes instead of the game (tools/n64/build.sh --bringup).
bringup = []
# Print the simulation's debug log (`Effect::Log`) through debugf.
game-log = []
# Sampling profiler: dumps the hottest code addresses with every perf log line.
profile = []
# With `profile`: sample only inside `Game::tick` (the simulation).
profile-sim = ["profile"]
# Phase 3S: run the f2-game simulation benchmark scenarios (no rendering) and log per-tick
# times + state checksums instead of the game (see src/simbench.rs).
simbench = []

[lints.rust]
# `target_vendor = "nintendo64"` comes from tools/n64/mips-nintendo64-none.json.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("nintendo64"))'] }

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
lto = true
debug = 1

[profile.dev]
panic = "abort"
opt-level = 1
