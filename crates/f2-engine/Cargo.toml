[package]
name = "f2-engine"
description = "wgpu renderer replacing the MDX library: models, textures, sprites, overlays, fonts."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[features]
default = ["std", "gpu"]
# Off: `#![no_std]` + `alloc` render core for OS-less targets (N64): `scene` (CPU transform ->
# TL triangle lists), `anim`, `textures`, `font`, `math`, the draw-list builder
# (`Renderer::build`, `DrawCmd`) and the CPU rasteriser (`soft`, single-threaded). `std`
# adds `load` (file helpers), `RgbaImage::write_png` and threaded `soft` bands.
std = ["f2-formats/std", "dep:png"]
# Console fast paths (the N64): skips arithmetic whose result equals its input up to the
# sign of zeros (e.g. unit scale matrices). Off = the PC's exact maths.
lean = []
# wgpu back end. Without it the renderer only draws on the CPU (`Renderer::new_soft`).
gpu = ["std", "dep:wgpu", "dep:pollster"]
# wgpu on a Vulkan driver reached through a raw `vkGetInstanceProcAddr` (no loader), presenting
# through its own `VkSwapchainKHR` (`VK_KHR_display` on the PS5). Host-testable: see `vkraw`.
ps5-vulkan = ["gpu", "wgpu/vulkan", "dep:ash"]
# Declares the statically linked PS5 RADV archive's `vk_icdGetInstanceProcAddr`
# (`GpuContext::new_ps5`). Compiles anywhere; links only against the driver archive.
ps5-static-driver = ["ps5-vulkan"]
# OpenGL ES 2 back end (`gles`): no dependencies, GL entry points supplied by the host.
gles2 = ["std"]

[dependencies]
f2-formats = { path = "../f2-formats", default-features = false }
wgpu = { version = "=30.0.1", optional = true }
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = { version = "=1.0.1", optional = true }
ash = { version = "=0.38.0", optional = true }
png = { version = "=0.18.1", optional = true }
# `math.rs` sin/acos table cache without std's `OnceLock`.
once_cell = { version = "1.21", default-features = false, features = ["race", "alloc"] }
# Float methods without std (`fmath`); with std the inherent methods are used unchanged.
libm = "0.2.16"
