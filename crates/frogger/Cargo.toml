[package]
name = "frogger"
description = "The Frogger 2 Rust port executable."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "frogger"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "vk_present"
required-features = ["ps5-vulkan"]

[features]
default = ["desktop", "audio-device"]
# Window, GPU and gamepads (winit, wgpu, gilrs): the desktop executable. Without it the
# library builds for hosts that bring their own platform layer and use the CPU renderer.
desktop = ["gpu", "f2-platform/window", "f2-platform/gamepad", "fontgen"]
# Builds the modern fonts on first run when the typeface is found (desktop; Android finds
# it only in `<data>/fonts`).
fontgen = ["dep:f2-fontgen"]
# The wgpu renderer in the library (`App::new`) without window or gamepads: console hosts
# that bring their own GPU context (e.g. the PS5 Vulkan path, f2-engine `ps5-static-driver`).
gpu = ["dep:wgpu", "f2-engine/gpu"]
# Real audio output (cpal: ALSA/PulseAudio/PipeWire, WASAPI, CoreAudio). Off = always muted;
# lets `cargo check --target *-apple-darwin --no-default-features` run without the macOS SDK
# (coreaudio-sys needs it for bindgen). See docs/PLATFORMS.md.
audio-device = ["f2-audio/cpal"]
# The PS5 GPU path on the desktop: wgpu from a raw vkGetInstanceProcAddr + own swapchain
# (f2-engine `vkraw`). `--example vk_present`; `F2_VK_RAW=1 frogger --headless ...`.
ps5-vulkan = ["desktop", "f2-engine/ps5-vulkan"]

[dependencies]
f2-game = { path = "../f2-game" }
f2-engine = { path = "../f2-engine", default-features = false, features = ["std"] }
f2-draw = { path = "../f2-draw" }
f2-platform = { path = "../f2-platform", default-features = false }
f2-audio = { path = "../f2-audio", default-features = false }
f2-bink = { path = "../f2-bink" }
f2-mods = { path = "../f2-mods" }
f2-modkit = { path = "../f2-modkit" }
f2-etc = { path = "../../tools/f2-etc" }
f2-formats = { path = "../f2-formats" }
f2-math = { path = "../f2-math" }
f2-net = { path = "../f2-net" }
f2-import = { path = "../f2-import" }
# Builds the modern fonts from the system typeface on first run (desktop only; consoles
# read the generated files bundled with the data).
f2-fontgen = { path = "../f2-fontgen", optional = true }
f2-media = { path = "../f2-media" }
# App icons (icon.rs): the embedded icon and icons made from the player's own artwork.
png = "=0.18.1"
wgpu = { version = "=30.0.1", optional = true }

# The exe's icon resource (build.rs), built natively on Windows (tools/package/build-windows.sh).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
