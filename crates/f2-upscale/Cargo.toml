[package]
name = "f2-upscale"
description = "DLSS, FSR 3.1 and FSR 4 super resolution and frame generation for the wgpu renderer (Windows, Direct3D 12)."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[dependencies]
f2-engine = { path = "../f2-engine" }
wgpu = { version = "=30.0.1" }

# The raw D3D12 interfaces behind wgpu's DX12 back end (the version wgpu-hal uses).
[target.'cfg(windows)'.dependencies]
windows-core = { version = "0.62", default-features = false }

[build-dependencies]
# native/f2_upscale.cpp (Windows MSVC targets only; headers vendored in native/).
cc = "1"
