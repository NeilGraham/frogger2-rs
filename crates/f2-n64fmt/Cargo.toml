[package]
name = "f2-n64fmt"
description = "Nintendo 64 render-model format (F2NM): RSP-ready meshes and TMEM-ready textures, shared by the asset packer (host) and the N64 renderer (docs/n64-model-format.md)."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true

[features]
default = ["encode"]
# Mesh/texture/file encoders. Needs `alloc` only, so it also builds for the N64 target
# (the renderer benchmarks build synthetic meshes at boot).
encode = []
# MDX object bank -> F2NM meshes (bank.rs); no_std + alloc.
objbank = ["encode", "dep:f2-formats"]

[dependencies]
f2-formats = { path = "../f2-formats", default-features = false, optional = true }
