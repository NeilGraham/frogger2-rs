[package]
name = "f2-draw"
description = "Drawing the simulation state (PC/drawloop.cpp): level scene, actors, effects, overlays. Shared by the desktop front end and the N64 port."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Off: `#![no_std]` + `alloc` (the N64 front end). The drawing is identical either way.
std = ["f2-engine/std", "f2-game/std", "f2-formats/std", "f2-math/std"]
# Console fast paths (the N64 front end): skips work whose result equals its input up to
# float rounding (e.g. interpolating an actor that did not move). Off = the PC's exact maths.
lean = ["f2-engine/lean"]

[dependencies]
f2-engine = { path = "../f2-engine", default-features = false }
f2-game = { path = "../f2-game", default-features = false }
f2-formats = { path = "../f2-formats", default-features = false }
f2-math = { path = "../f2-math", default-features = false }
# Button-prompt table shared by the text overlays (a `thread_local!` before `no_std`).
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
libm = "0.2.16"

[lints.rust]
# `target_vendor = "nintendo64"` (tools/n64/mips-nintendo64-none.json): N64 hot-code sections.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("nintendo64"))'] }
