[package]
name = "f2-package"
description = "Builds ready-to-run packages (Windows, macOS, Linux AppImage, Android APK, PS4 fPKG, PS5 app folder, N64 ROM) from the player's imported game and a prebuilt, data-free runtime."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[dependencies]
png = "=0.18.1"
# PS4 fPKG / PS5 export (src/ps4*, src/ps5*): hashing, AES, RSA arithmetic, runtime zips.
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
zip.workspace = true
serde_json.workspace = true

[dev-dependencies]
# An independent BC7 decoder to check the PS5 artwork encoder against.
bcdec_rs = "0.2"
