[package]
name = "f2-package"
description = "Builds ready-to-run packages (Windows, macOS, Linux AppImage, Android APK, PS4 fPKG, PS5 app folder, N64 ROM) from the player's imported game and a prebuilt, data-free runtime."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[dependencies]
png = "=0.18.1"
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
# N64: the asset pack (portable profile: pure-Rust encoders) and the DFS writer.
f2-n64pack = { path = "../../tools/f2-n64pack" }
