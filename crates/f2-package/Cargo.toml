[package]
name = "f2-package"
description = "Builds ready-to-run packages (Windows, macOS, Linux AppImage, Android APK, PS4 fPKG, PS5 app folder and fPKG, N64 ROM) from the player's imported game and a prebuilt, data-free runtime."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[dependencies]
backhand = { version = "0.25.5", default-features = false, features = ["gzip"] }
editpe = { version = "0.2.4", default-features = false, features = ["std"] }
plist = "1.10.1"
png = "=0.18.1"
# Android: reading the shell APK (inflate), zip CRCs, APK Signature Scheme v2 (ECDSA P-256 /
# SHA-256). All pure Rust (no C / asm builds), so exports work on Windows, macOS and Linux.
miniz_oxide = "0.8"
crc32fast = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json.workspace = true
ruzstd = "0.9.1"
# PS4 fPKG / PS5 export (src/ps4*, src/ps5*): hashing, AES, RSA arithmetic, runtime zips.
hmac = "0.12"
aes = "0.8"
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
zip.workspace = true
serde.workspace = true
# PS5 fake package (src/ps5/pkg): the PFS digests and path hashes.
sha3 = "0.10"
# N64: the asset pack (portable profile: pure-Rust encoders) and the DFS writer.
f2-n64pack = { path = "../../tools/f2-n64pack" }

[dev-dependencies]
# An independent BC7 decoder to check the PS5 artwork encoder against.
bcdec_rs = "0.2"
