[package]
name = "f2-package"
description = "Builds ready-to-run packages (Windows, macOS, Linux AppImage, Android APK, PS4 fPKG, PS5 app folder, N64 ROM) from the player's imported game and a prebuilt, data-free runtime."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[dependencies]
png = "=0.18.1"
# Android: reading the shell APK (inflate), zip CRCs, APK Signature Scheme v2 (ECDSA P-256 /
# SHA-256). All pure Rust (no C / asm builds), so exports work on Windows, macOS and Linux.
miniz_oxide = "0.8"
crc32fast = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json.workspace = true
