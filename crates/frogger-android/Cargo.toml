[package]
name = "frogger-android"
description = "Android host for the Frogger 2 port: NativeActivity via android-activity, wgpu (Vulkan/GLES), cpal (AAudio), touch controls and Android gamepads, in-app import."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

# Built as `libfrogger_android.so` by `tools/android/build-apk.sh` (cargo-ndk). The rlib
# lets `cargo test --workspace` run the portable parts (touch layout) on the host.
[lib]
name = "frogger_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Audio output (cpal) only when building for Android: on other hosts the crate is only
# unit-tested, and enabling it would pull cpal's CoreAudio into the macOS cross-checks.
frogger = { path = "../frogger", default-features = false, features = ["gpu", "fontgen"] }
f2-engine = { path = "../f2-engine", default-features = false, features = ["std", "gpu"] }
f2-platform = { path = "../f2-platform", default-features = false }
f2-audio = { path = "../f2-audio", default-features = false }
f2-import = { path = "../f2-import" }
wgpu = "=30.0.1"
# The bundle index of exported APKs (bundle.rs).
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
frogger = { path = "../frogger", default-features = false, features = ["gpu", "fontgen", "audio-device"] }
# The activity glue and main loop (the same version winit uses on the desktop lockfile).
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
raw-window-handle = "0.6"
libc = "0.2"
# Calls into MainActivity (the file picker); same versions cpal already uses.
jni = "0.21"
